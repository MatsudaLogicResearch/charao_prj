[pytest]
# --tb=short: テスト失敗時のトレースバック表示を短縮する。
# デフォルト(long)はエラー発生前にコード全体を表示するが、
# shortはエラーメッセージ(E行)を先頭に表示するため視認性が高い。
# 実行時に --tb=long や --tb=no で上書き可能。
# --capture=tee-sys: コンソール表示とキャプチャを両立する（-s の代替）。
# test_log/{script}.log への出力保存が有効になる。
addopts = --tb=short --capture=tee-sys

# lrpymrpc_verbose: lrPymRPC の実行ログを成功時も表示するか（true/false）
# デフォルト false = 成功時は非表示、失敗時のみ表示
# true にすると pip install ログ等の全出力を表示する（デバッグ時に使用）
lrpymrpc_verbose = false
